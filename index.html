<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        AgroTech | Gestión agrícola inteligente
    </title>

    <style>

        *{
            box-sizing:border-box;
        }

        body{

            margin:0;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            color:white;

            background:#123a28;

        }


        .hero{

            min-height:100vh;

            display:flex;

            align-items:center;

            background:

                linear-gradient(
                    90deg,
                    rgba(8,41,26,.90),
                    rgba(8,41,26,.60),
                    rgba(8,41,26,.10)
                ),

                url("static/img/hero (2).png")
                center / cover
                no-repeat;

        }


        .container{

            width:min(1180px,90%);

            margin:auto;

        }


        .logo{

            width:220px;

            margin-bottom:42px;

        }


        .tag{

            color:#cce8a6;

            font-size:.85rem;

            font-weight:800;

            letter-spacing:2px;

            text-transform:uppercase;

        }


        h1{

            max-width:760px;

            margin:
                18px 0 25px;

            font-size:
                clamp(3rem,7vw,6rem);

            line-height:.95;

            letter-spacing:-3px;

        }


        h1 span{

            display:block;

            color:#b7dd84;

        }


        p{

            max-width:620px;

            color:
                rgba(255,255,255,.86);

            font-size:1.1rem;

            line-height:1.7;

        }


        .buttons{

            display:flex;

            flex-wrap:wrap;

            gap:12px;

            margin-top:32px;

        }


        .btn{

            display:inline-block;

            padding:
                14px 24px;

            border-radius:10px;

            text-decoration:none;

            font-weight:700;

        }


        .primary{

            background:#a7d86c;

            color:#123a28;

        }


        .secondary{

            border:
                1px solid rgba(255,255,255,.45);

            color:white;

        }


        .authors{

            margin-top:45px;

            color:
                rgba(255,255,255,.64);

            font-size:.9rem;

        }


        @media(max-width:700px){

            .hero{

                background:

                    linear-gradient(
                        rgba(8,41,26,.82),
                        rgba(8,41,26,.92)
                    ),

                    url("static/img/hero (2).png")
                    center / cover
                    no-repeat;

            }


            .logo{

                width:180px;

            }


            h1{

                font-size:3.1rem;

            }

        }

    </style>

</head>


<body>


    <main class="hero">


        <div class="container">


            <img
                src="static/img/logo-agrotech.png"
                alt="AgroTech"
                class="logo">


            <div class="tag">
                Gestión agrícola inteligente
            </div>


            <h1>

                Tecnología que

                <span>
                    organiza tu campo.
                </span>

            </h1>


            <p>

                Plataforma web para la gestión
                de productos, clientes, proveedores
                y facturación.

            </p>


            <div class="buttons">


                <a
                    href="AQUI_PONES_TU_LINK_DE_RENDER"
                    class="btn primary">

                    Acceder a AgroTech

                </a>


                <a
                    href="AQUI_PONES_TU_LINK_DE_GITHUB"
                    class="btn secondary">

                    Ver código

                </a>


            </div>


            <div class="authors">

                Desarrollado por
                Lissi Antonella Cornejo Olaya
                y Jeison Teobaldo García Arreaga

            </div>


        </div>


    </main>


</body>

</html>
